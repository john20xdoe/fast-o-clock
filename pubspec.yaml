name: fast_oclock
description: "Fast O'Clock — a simple, offline-first intermittent fasting tracker."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  sqflite: ^2.4.1
  path: ^1.9.0
  shared_preferences: ^2.3.3
  provider: ^6.1.2
  flutter_local_notifications: ^18.0.1
  timezone: ^0.10.0
  intl: ^0.20.1
  share_plus: ^10.1.2
  file_picker: ^8.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  sqflite_common_ffi: ^2.3.4

flutter:
  uses-material-design: true
